<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather App</title>
    <link rel="stylesheet" href="/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;}</style>
  </head>
  <body class="relative text-slate-900 bg-sunny" style="font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;">
    <!-- dark overlay -->
    <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(3,7,18,0.55), rgba(3,7,18,0.65));"></div>
    <!-- Extra cloud for mild weather -->
    <div class="cloud-extra absolute hidden"></div>
    <div class="relative min-h-screen flex items-start justify-center p-6">
      <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        <!-- Left: main card (search + forecast) occupying 2 cols on md -->
        <div class="md:col-span-2 rounded-xl p-6" style="background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(250,250,250,0.9)); box-shadow: 0 10px 40px rgba(2,6,23,0.45); backdrop-filter: blur(6px);">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
              <div class="rounded-full bg-blue-600 text-white flex items-center justify-center" style="width:48px;height:48px;font-size:22px;">🌦️</div>
              <div>
                <h1 class="text-2xl font-semibold">Mausam</h1>
                <div class="text-sm text-slate-600">Weather • Quick forecast</div>
              </div>
            </div>
            <div class="text-sm text-slate-600">Demo</div>
          </div>

          <div class="mb-4 grid grid-cols-1 md:grid-cols-3 gap-3">
            <input id="cityInput" class="col-span-2 border rounded px-3 py-2" placeholder="Enter city (e.g. London)" />
            <div class="flex gap-2">
              <button id="getBtn" class="bg-blue-600 text-white px-4 py-2 rounded flex items-center gap-2">
                <span id="btnText">Get Forecast</span>
                <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
              </button>
              <button id="useLocBtn" class="bg-white border px-3 py-2 rounded flex items-center gap-2 text-sm">
                Use my location
              </button>
            </div>
          </div>

          <div id="output" class="space-y-4"></div>
        </div>

        <!-- Right: current weather summary -->
        <aside class="rounded-xl p-6 flex flex-col items-center text-center" style="background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(245,247,250,0.95)); box-shadow: 0 8px 30px rgba(2,6,23,0.35);">
          <div id="headerCurrent" class="mb-4">
            <div class="text-slate-500 text-sm">Current</div>
            <div class="text-5xl font-bold mt-2" id="headerTemp">--°C</div>
            <div class="text-sm text-slate-600 mt-1" id="headerDesc">No data</div>
          </div>
          <div id="current" class="w-full"></div>
          <div class="mt-4 text-xs text-slate-500">Powered by OpenWeatherMap</div>
        </aside>
      </div>
    </div>

    <script src="/main.js"></script>
  </body>
</html>
