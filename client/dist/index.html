<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather App</title>
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body class="relative text-slate-900" style="background-image: url('https://images.unsplash.com/photo-1501975558160-017f0c5b9d28?auto=format&fit=crop&w=1950&q=80'); background-size:cover; background-position:center;">
    <!-- dark overlay -->
    <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(3,7,18,0.55), rgba(3,7,18,0.65));"></div>
    <div class="relative min-h-screen flex items-start justify-center p-6">
      <div class="w-full max-w-3xl weather-card rounded-xl p-6" style="background: rgba(255,255,255,0.85); box-shadow: 0 8px 30px rgba(2,6,23,0.5);">
        <header class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="rounded-full bg-blue-600 text-white flex items-center justify-center" style="width:42px;height:42px;font-size:20px;">🌦️</div>
            <div>
              <h1 class="text-2xl font-semibold">Mausam</h1>
              <div class="text-sm text-slate-600">Weather • Quick forecast</div>
            </div>
          </div>
          <div class="text-sm text-slate-600">Demo</div>
        </header>

        <div class="mb-4 p-4 rounded text-sm text-slate-700" style="background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(250,250,250,0.9));">
          <strong>About</strong>
          <p class="mt-2">A simple weather app demo built with Node.js and Express.</p>
        </div>

        <div class="mb-4 flex gap-2">
          <input id="cityInput" class="flex-1 border rounded px-3 py-2" placeholder="Enter city (e.g. London)" />
          <button id="getBtn" class="bg-blue-600 text-white px-4 py-2 rounded flex items-center gap-2">
            <span id="btnText">Get Forecast</span>
            <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          </button>
          <button id="useLocBtn" class="bg-white border px-3 py-2 rounded flex items-center gap-2 text-sm">
            Use my location
          </button>
        </div>

        <div id="output" class="space-y-4"></div>
        <hr class="my-4" />
        <div id="current" class="space-y-2"></div>
      </div>
    </div>

    <script src="/main.js"></script>
  </body>
</html>
