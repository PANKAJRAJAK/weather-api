# Render service definition for Mausam weather app
# After pushing this file, create a new Web Service on Render and connect to this repository
services:
  - type: web
    name: mausam-weather
    env: node
    region: frankfurt # change region if desired (or remove to use default)
    plan: free
    branch: main
    buildCommand: npm ci && npm run tailwind:build || true
    startCommand: npm start
    # Do NOT put secret values here. Set OPENWEATHER_API_KEY in the Render dashboard (Environment > Environment Variables).
    # envVars:
    #   - key: OPENWEATHER_API_KEY
    #     value: ""
